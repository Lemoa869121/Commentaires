<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commentaires</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231d3f5e'/%3E%3Cpath d='M8 10h16M8 16h16M8 22h10' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="entete">
    <h1>Commentaires</h1>
    <div class="actions">
      <a class="btn discret" href="admin.html">Panneau de contrôle</a>
      <button type="button" class="btn" id="btn-reinit">Réinitialiser</button>
      <button type="button" class="btn principal" id="btn-copier" disabled>Copier le commentaire</button>
    </div>
  </header>

  <main class="page">
    <div class="col-form">
      <form id="formulaire" autocomplete="off" onsubmit="return false">
        <p class="chargement">Chargement…</p>
      </form>
    </div>
    <aside class="col-apercu" aria-label="Aperçu du commentaire">
      <div class="apercu-titre">Aperçu</div>
      <div class="feuille"><div id="apercu"></div></div>
    </aside>
  </main>

  <dialog id="dlg-ventouses">
    <form method="dialog">
      <h2>Ventouses</h2>
      <p class="note">Texte libre — une ligne = une puce. Ex. : Bandeau ventouses (300kg)</p>
      <textarea rows="6" aria-label="Texte ventouses"></textarea>
      <div class="actions">
        <button class="btn" value="annuler">Annuler</button>
        <button class="btn principal" value="ok">Valider</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/regles.js"></script>
  <script src="js/generateur.js"></script>
  <script src="js/donnees.js"></script>
  <script src="js/formulaire.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
